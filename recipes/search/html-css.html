<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SaglitzDesign — Search</title>
<style>
  :root {
    --ring: #4f46e5; --accent: #4f46e5; --text: #171717; --muted: #737373;
    --border: #d4d4d4; --bg: #fff; --hover: #f5f5f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ring: #818cf8; --accent: #6366f1; --text: #fafafa; --muted: #a3a3a3;
      --border: #404040; --bg: #171717; --hover: #262626;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; font: 15px/1.5 system-ui, sans-serif; color: var(--text); background: Canvas; }
  .search { display: flex; align-items: center; gap: 8px; max-width: 28rem; }
  .search__field {
    flex: 1; display: flex; align-items: center; gap: 8px;
    min-height: 44px; padding: 0 12px; border: 1px solid var(--border);
    border-radius: 10px; background: var(--bg);
  }
  .search__field:focus-within { outline: 2px solid var(--ring); outline-offset: 2px; }
  .search input {
    flex: 1; min-height: 44px; border: 0; background: transparent; color: var(--text);
    font: inherit; font-size: .875rem;
  }
  .search input:focus { outline: none; }
  .search button {
    min-height: 44px; min-width: 44px; border: 0; background: none; color: var(--muted);
    cursor: pointer; border-radius: 10px; font: inherit;
  }
  .search button:hover { background: var(--hover); }
  .search button:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  .search__cancel { color: var(--accent); font-weight: 500; min-width: auto; padding: 0 12px; }
</style>
</head>
<body>
  <form class="search" role="search" aria-label="Search">
    <div class="search__field">
      <span aria-hidden="true">⌕</span>
      <input type="search" name="q" placeholder="Search invoices" aria-label="Search invoices" />
      <button type="button" aria-label="Clear" hidden>×</button>
    </div>
    <button type="button" class="search__cancel">Cancel</button>
  </form>
  <script>
    const form = document.querySelector(".search");
    const input = form.querySelector("input");
    const clear = form.querySelector("[aria-label='Clear']");
    input.addEventListener("input", () => { clear.hidden = input.value.length === 0; });
    clear.addEventListener("click", () => { input.value = ""; clear.hidden = true; input.focus(); });
  </script>
</body>
</html>
