<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SaglitzDesign — Tooltip</title>
<style>
  :root {
    --ring: #4f46e5; --accent: #4f46e5; --text: #171717; --bubble: #171717; --on-bubble: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ring: #818cf8; --accent: #6366f1; --text: #fafafa; --bubble: #f5f5f5; --on-bubble: #171717;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 48px; font: 15px/1.5 system-ui, sans-serif; color: var(--text); background: Canvas; }
  .wrap { position: relative; display: inline-flex; }
  .trigger {
    min-height: 44px; min-width: 44px; border: 0; border-radius: 10px;
    background: transparent; color: var(--accent); font: inherit; cursor: pointer;
  }
  .trigger:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  .tip {
    position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
    margin-bottom: 8px; padding: 8px 12px; border-radius: 10px;
    background: var(--bubble); color: var(--on-bubble); font-size: .75rem;
    white-space: nowrap; pointer-events: none;
  }
  .tip[hidden] { display: none; }
  .tip::after {
    content: ""; position: absolute; top: 100%; left: 50%;
    width: 8px; height: 8px; background: var(--bubble);
    transform: translateX(-50%) rotate(45deg); margin-top: -8px;
  }
  @media (prefers-reduced-motion: no-preference) {
    .tip:not([hidden]) { animation: fade .15s ease-out; }
    @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
  }
</style>
</head>
<body>
  <span class="wrap">
    <button type="button" class="trigger" aria-label="Download CSV" aria-describedby="tip">↓</button>
    <span id="tip" role="tooltip" class="tip" hidden>Download CSV</span>
  </span>
  <script>
    const btn = document.querySelector(".trigger");
    const tip = document.querySelector(".tip");
    const show = () => { tip.hidden = false; };
    const hide = () => { tip.hidden = true; };
    btn.addEventListener("mouseenter", show);
    btn.addEventListener("mouseleave", hide);
    btn.addEventListener("focus", show);
    btn.addEventListener("blur", hide);
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") hide(); });
  </script>
</body>
</html>
