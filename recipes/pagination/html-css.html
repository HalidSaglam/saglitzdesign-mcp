<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SaglitzDesign — Pagination</title>
<style>
  :root { --ring: #4f46e5; --accent: #4f46e5; --text: #171717; --muted: #737373; --border: #d4d4d4; --bg: #fff; --hover: #f5f5f5; }
  @media (prefers-color-scheme: dark) {
    :root { --ring: #818cf8; --accent: #6366f1; --text: #fafafa; --muted: #a3a3a3; --border: #404040; --bg: #171717; --hover: #262626; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; font: 15px/1.5 system-ui, sans-serif; color: var(--text); background: Canvas; }
  nav { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  ol { display: flex; gap: 8px; margin: 0; padding: 0; list-style: none; }
  a, span {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 44px; min-height: 44px; padding: 0 12px;
    border: 1px solid var(--border); border-radius: 10px;
    background: var(--bg); color: var(--text); text-decoration: none; font: inherit;
  }
  a:hover { background: var(--hover); }
  a:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  a[aria-current="page"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  span[aria-disabled="true"], span[aria-hidden] { color: var(--muted); }
</style>
</head>
<body>
  <nav aria-label="Pagination">
    <span aria-disabled="true">Previous</span>
    <ol>
      <li><a href="?page=1" aria-current="page">1</a></li>
      <li><a href="?page=2">2</a></li>
      <li><a href="?page=3">3</a></li>
      <li><span aria-hidden="true">…</span></li>
      <li><a href="?page=12">12</a></li>
    </ol>
    <a href="?page=2" aria-label="Next page">Next</a>
  </nav>
</body>
</html>
